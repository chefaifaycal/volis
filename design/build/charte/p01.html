<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}

.scr{position:relative;width:393px;height:852px;overflow:hidden;font-family:'Inter';color:var(--ink);-webkit-font-smoothing:antialiased}
.abs{position:absolute}
.grain{position:absolute;inset:0;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");background-size:240px 240px;pointer-events:none}
.lay{position:absolute;inset:0;display:flex;flex-direction:column}
.sb{height:54px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:16px 28px 0 36px}
.sb .t{font:600 17px/22px Inter}.sb .ic{display:flex;gap:6px;align-items:center}
.hi{height:34px;flex:none;display:flex;justify-content:center;align-items:flex-end;padding-bottom:8px}.hi div{width:134px;height:5px;border-radius:3px}
.ct{flex:1;display:flex;flex-direction:column;padding:0 16px 8px;min-height:0;position:relative}
.row{display:flex;align-items:center}.col{display:flex;flex-direction:column}
.h{font-family:'Plus Jakarta Sans'}
.t2{color:var(--text2)}
.sp{flex:1}
.cta{height:56px;border-radius:28px;background:var(--primary);color:var(--onPrimary);font:700 17px/22px Inter;display:flex;align-items:center;justify-content:center;flex:none;gap:8px}
.sbtn{height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;gap:10px;font:600 16px/22px Inter;flex:none;background:var(--surface);border:1.5px solid var(--sbtnBorder);color:var(--ink)}
.lab{font:600 14px/18px Inter}
.box{height:52px;border-radius:16px;display:flex;align-items:center;gap:12px;padding:0 16px;font:400 16px/22px Inter;background:var(--field);border:1.5px solid var(--border)}
.link{min-height:44px;display:flex;align-items:center;color:var(--link);font:600 15px/20px Inter}
.div{display:flex;align-items:center;gap:12px;font:500 14px/20px Inter;color:var(--text2)}.div i{flex:1;height:1.5px;background:var(--divider)}
.chip{height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;font:600 15px/20px Inter;white-space:nowrap;background:var(--field);border:1.5px solid var(--border);color:var(--ink)}
.chip.sel{background:var(--chipSel);border:2px solid var(--primary)}
.dots{display:flex;gap:8px;align-items:center;justify-content:center;height:20px}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--dotOff)}.dots i.on{width:28px;background:var(--dotOn)}
.pill{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;font:600 13px/18px Inter}
img.ill{position:absolute;object-fit:contain}

.hand{font-family:'Caveat';font-weight:700;color:#1E2A3A}
.card{position:relative;background:#FFFDF8;border-radius:6px;box-shadow:0 1px 0 rgba(30,42,58,.06),0 10px 24px -10px rgba(30,42,58,.28)}
.tape{position:absolute;height:26px;opacity:.88;clip-path:polygon(0 0,4% 14%,0 28%,4% 42%,0 56%,4% 70%,0 84%,4% 100%,100% 100%,96% 86%,100% 72%,96% 58%,100% 44%,96% 30%,100% 16%,96% 0);z-index:5}
.tape.t{background:repeating-linear-gradient(45deg,rgba(15,118,110,.55) 0 6px,rgba(15,118,110,.38) 6px 12px)}
.tape.c{background:repeating-linear-gradient(-45deg,rgba(255,122,89,.65) 0 6px,rgba(255,122,89,.45) 6px 12px)}
.tape.k{background:repeating-linear-gradient(90deg,rgba(217,168,108,.6) 0 3px,rgba(217,168,108,.45) 3px 9px)}
.mono{font-family:'JetBrains Mono'}

.cd{position:relative;background:#FFFDF8;border:1.5px solid #E4DACA;border-radius:20px}
.c4 .cd{border:none;border-radius:8px;box-shadow:0 1px 0 rgba(30,42,58,.06),0 10px 22px -12px rgba(30,42,58,.32)}
.h2{font:800 17px/22px 'Plus Jakarta Sans';color:#1E2A3A}
.h1{font:800 26px/32px 'Plus Jakarta Sans';letter-spacing:-.5px;color:#1E2A3A}

.xs{font:600 12px/16px Inter;color:#4E5A69}
.b15{font:600 15px/20px Inter;color:#1E2A3A}

.c4 .ibtn{border:1.5px solid #1E2A3A}
.tb{height:60px;flex:none;display:flex;justify-content:space-around;align-items:flex-start;padding:6px 6px 0;background:#FFFDF8;border-top:1px solid #E4DACA;position:relative;z-index:20}
.c4 .tb{border-top:2px dashed #CFC4AF}
.ti{width:72px;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 11px/14px Inter;color:#4E5A69}
.ti .pi{width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.ti.on{color:#0F766E;font-weight:800}.ti.on .pi{background:#D6ECE8}
.c4 .ti.on{color:#1E2A3A}.c4 .ti.on .pi{background:#FFD3C4;border:1.5px solid #1E2A3A}
.badge{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:12px;font:700 11.5px/16px Inter;white-space:nowrap}
.mono{font-family:'JetBrains Mono'}
.fld{display:flex;flex-direction:column;gap:6px}
.inp{height:50px;border-radius:14px;display:flex;align-items:center;gap:10px;padding:0 14px;font:500 16px/22px Inter;background:#FFFDF8;border:1.5px solid #7E7A70;color:#1E2A3A}
.c4 .inp{border-radius:8px}
.cb{width:24px;height:24px;flex:none;border-radius:7px;background:#0F766E;display:flex;align-items:center;justify-content:center}
.ctab{height:52px;border-radius:26px;background:#0F766E;color:#fff;font:700 16px/22px Inter;display:flex;align-items:center;justify-content:center;gap:8px;flex:none}
